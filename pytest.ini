[pytest]
# Python test roots: tests/, production/ and tools/ all hold pytest suites
# (tools/*/test_*.py + tools/promptlab/tests/); collect any test_*.py / *_test.py.
testpaths = tests production tools
# tools/llama/ is a local build artifact (pinned llama.cpp source, gitignored).
# Its upstream suites need wget/appium and must never gate this project's tests.
norecursedirs = tools/llama .git .venv node_modules
